<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تواصل مع صالون أسرار الجمال</title>
    <!-- استدعاء مكتبة الأيقونات الفخمة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f0f0f;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: #181818;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(212, 175, 55, 0.15);
            border: 1px solid #282828;
        }
        /* تعديل حجم اللوغو ليتناسب تماماً مع كل شاشة */
        .logo-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            background-color: #000;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        h1 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            background: #202020;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .link-btn:active {
            transform: scale(0.98);
        }
        /* تأثير عند التحويم (على الكمبيوتر) */
        .link-btn:hover {
            background-color: #282828;
        }
        
        /* ألوان الأيقونات الفخمة */
        .link-btn i {
            font-size: 22px;
        }
        .fa-facebook { color: #1877F2; }
        .fa-instagram { color: #E4405F; }
        .fa-tiktok { color: #25F4EE; }

        .footer {
            margin-top: 40px;
            color: #666666;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار الصالون -->
        <div class="logo-container">
            <img src="https://i.ibb.co/Kp5dG41B/Messenger-creation-FB754-A96-1288-4-B98-B3-FE-C7648-EF6-B6-DD.jpg" alt="شعار صالون أسرار الجمال">
        </div>

        <h1>صالون أسرار الجمال</h1>
        <p class="subtitle">تابعونا على وسائل التواصل الاجتماعي لمعرفة أحدث العروض والخدمات</p>

        <!-- روابط التواصل الجاهزة -->
        <div class="links-container">
            <!-- فيسبوك -->
            <a href="https://www.facebook.com/share/1bbkN8Lw1H/?mibextid=wwXIfr" target="_blank" class="link-btn">
                <i class="fa-brands fa-facebook"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>

            <!-- إنستغرام -->
            <a href="https://www.instagram.com/asraraljamal.qr" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i>
                <span>حسابنا على إنستغرام</span>
            </a>

            <!-- تيك توك -->

                <i class="fa-brands fa-tiktok"></i>
                <span>حسابنا على تيك توك</span>
            </a>
        </div>

        <div class="footer">
            <p>© صالون أسرار الجمال - جميع الحقوق محفوظة</p>
        </div>
    </div>

</body>
</html>
